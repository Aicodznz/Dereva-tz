name: papo_hapo_grocery_vendor
description: A modern Flutter-based vendor panel for grocery stores in the Papo Hapo Super App.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  fl_chart: ^0.66.0
  lucide_icons_flutter: ^1.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
