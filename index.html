<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Papo Hapo Super App</title>
    <meta name="description" content="A clean, modern multi-service platform providing food, grocery, taxi, daladala public transit tracking, parcel delivery, and more." />
    <meta property="og:title" content="Papo Hapo Super App" />
    <meta property="og:description" content="A clean, modern multi-service platform providing food, grocery, taxi, daladala public transit tracking, parcel delivery, and more." />
    <meta property="og:image" content="/brand/whatsapp-badge.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/whatsapp-badge.png" />
    <link rel="icon" type="image/png" href="/brand/app-icon.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/brand/app-icon.png?v=2" />
    <link rel="apple-touch-icon" href="/brand/app-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          try {
            navigator.serviceWorker.register('/sw.js')
              .then(function(reg) {
                try {
                  var forceOffline = window.localStorage.getItem('papohapo_force_offline_maps_v1') === '1';
                  if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({ type: 'SET_FORCE_OFFLINE', value: forceOffline });
                  }
                } catch (e) {}
              })
              .catch(function() {});
          } catch (e) {}
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
