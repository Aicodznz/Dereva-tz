<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Papo Hapo Super App</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script>
      // Single-Page App redirect decoder for GitHub Pages
      (function(l) {
        if (l.search.startsWith('?p=/')) {
          var path = l.search.slice(4).split('&')[0].replace(/~and~/g, '&');
          var basePath = l.pathname.endsWith('/') ? l.pathname : l.pathname + '/';
          window.history.replaceState(null, null, basePath + (path.startsWith('/') ? path.slice(1) : path) + l.hash);
        }
      }(window.location));

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const basePath = window.location.hostname.endsWith('github.io')
            ? (window.location.pathname.split('/').filter(Boolean)[0] ? '/' + window.location.pathname.split('/').filter(Boolean)[0] + '/sw.js' : './sw.js')
            : './sw.js';
          navigator.serviceWorker.register(basePath)
            .then(reg => console.log('Papo Hapo Service Worker Registered!', reg.scope))
            .catch(err => console.log('Service Worker registration failed: ', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
