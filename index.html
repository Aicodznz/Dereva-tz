<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Papo Hapo Super App</title>
    <meta name="description" content="A clean, modern multi-service platform providing food, grocery, taxi, daladala public transit tracking, parcel delivery, and more." />
    <meta property="og:title" content="Papo Hapo Super App" />
    <meta property="og:description" content="A clean, modern multi-service platform providing food, grocery, taxi, daladala public transit tracking, parcel delivery, and more." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // In AI Studio preview and development environments, unregister stale service workers and purge caches
        if (window.location.hostname.includes('run.app') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
        } else {
          window.addEventListener('load', function() {
            try {
              navigator.serviceWorker.register('/sw.js')
                .then(function(reg) { console.log('SW Registered', reg.scope); })
                .catch(function(err) { console.log('SW failed: ', err); });
            } catch (e) {}
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
