<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Papo Hapo Super App</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects non-root requests back to index.html with ?p=<path>
      (function() {
        var segmentCount = 1; // 1 segment for repository name: /Dereva-tz/
        var l = window.location;
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var repoName = pathSegments.length > 0 ? pathSegments[0] : '';
        var remainingPath = pathSegments.slice(segmentCount).join('/');
        
        var destination = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repoName + '/?p=/' +
          encodeURIComponent(remainingPath) +
          (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
          l.hash;

        l.replace(destination);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
